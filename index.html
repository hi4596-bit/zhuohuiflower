.shell{display:flex;flex-direction:column;width:100%;height:100%;height:100dvh;max-width:none;padding:0;margin:0}
.topbar,.intro,.board-top{display:none!important}
.board{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;height:auto;max-width:none;margin:0;padding:10px 10px 0;border:0;border-radius:0;box-shadow:none;background:transparent;overflow:hidden}
.spread{display:block;flex:1;min-height:0;width:100%;height:auto;max-width:none;margin:8px 0 10px;box-shadow:none;position:relative;overflow:visible;border-radius:0;background:transparent;touch-action:pan-y}
.panel{display:none!important;position:absolute;inset:0;width:100%;height:100%;min-height:0;max-height:100%;padding:clamp(24px,7vw,36px);border:0;border-radius:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--cream);box-shadow:0 12px 28px #26352a20}
.panel.current{display:flex!important;z-index:2;will-change:transform;transition:transform .22s ease,opacity .22s ease;scale:1}
.panel.next-preview{display:flex!important;z-index:1;inset:0;transform:translate3d(0,5px,0) scale(.965);transform-origin:center center;pointer-events:none;box-shadow:0 8px 18px #26352a12;transition:transform .24s ease}
.panel.next-preview.sage-panel{background:#7f9385!important;background-color:#7f9385!important;color:white!important}
.panel.next-preview a,.panel.next-preview button{pointer-events:none}


.panel.current.dragging{transition:none!important;user-select:none;-webkit-user-select:none;cursor:grabbing}
.panel h2{font-size:clamp(32px,9vw,46px)}
.panel h3{font-size:25px}
.photo{min-height:0;flex:1 1 auto;max-height:40vh}
.cover .photo{min-height:180px}
.page-no{right:22px;top:20px}
.navfoot{display:flex!important;flex:0 0 66px;align-items:center;justify-content:center;flex-wrap:nowrap;margin:0;padding:0 12px 4px;gap:8px}
.navfoot>span:first-child{display:none!important}
.navtools{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.arrow{width:42px;height:42px;flex-shrink:0;border:1px solid #bac5b9;background:#f9faf5;box-shadow:0 3px 10px #293a2d12;font-size:20px}
.dots{gap:6px}
.dot{width:6px;height:6px}
.dot.active{width:18px}
.counter{min-width:42px;font-size:10px;color:#526557}
}

@media(min-width:851px){.panel{display:flex!important}}
@media print{body{background:white}.shell{padding:0;max-width:none}.topbar,.intro,.board-top,.navfoot{display:none!important}.board{padding:0;border:0;box-shadow:none;background:white}.spread{box-shadow:none;grid-template-columns:repeat(var(--cols,3),1fr)}.panel{display:flex!important;min-height:190mm}.panel.current{display:flex!important}}

/* Hide active-page green selection frame on mobile only */
@media(max-width:850px){
  .panel.current{box-shadow:none!important;outline:none!important}
}


/* Mobile navigation hit-area fix: keep the card stack in its own layer and controls above it. */
@media(max-width:850px){
  .shell{height:100vh;height:100dvh;min-height:0;overflow:hidden}
  .board{position:relative;z-index:0;flex:1 1 auto;min-height:0;overflow:hidden}
  .spread{position:relative;z-index:1;isolation:isolate;flex:1 1 0%;height:0;min-height:0;margin:8px 0 6px;overflow:visible}
  .navfoot{position:relative;z-index:20;isolation:isolate;display:flex!important;flex:0 0 76px;height:76px;min-height:76px;margin:0;padding:0 12px 4px;box-sizing:border-box;pointer-events:auto}
  .navtools,.arrow,.dots,.dot{position:relative;z-index:21;pointer-events:auto;touch-action:manipulation}
  .arrow{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:22}
}


/* --- added: image blocks, grouping, safe-area --- */
.photo img,.product-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.push{margin-top:auto}
.panel.sage-panel .action{background:#f5f4eb;color:#43594a}
.data-error{margin:40px auto;max-width:640px;padding:20px 24px;background:#fff3f0;border:1px solid #e3a99c;color:#8a2f1c;font:14px/1.7 Arial,sans-serif;white-space:pre-wrap}
@media(max-width:850px){.navfoot{padding-bottom:max(4px,env(safe-area-inset-bottom))!important;height:auto;min-height:76px}}

/* --- photo theme: full-bleed background + absolutely positioned text --- */
.panel.photo-panel{padding:0;color:#fff;background:#56664f;container-type:inline-size;overflow:hidden}
.photo-panel .bg{position:absolute;inset:0;z-index:0}
.photo-panel .bg img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.photo-panel .bg::after{content:"";position:absolute;inset:0;background:var(--oc,#000);opacity:var(--ov,.2)}
.photo-panel .page-no{z-index:3;color:#fff}
.photo-panel .flow{position:relative;z-index:2;margin-top:auto;padding:25px}
.photo-panel .abs{position:absolute;z-index:2;margin:0}
.photo-panel .abs>*{margin:0;color:inherit;font-family:inherit;font-weight:inherit;letter-spacing:0;line-height:1.18;font-size:var(--fs,4cqw);text-shadow:0 1px 14px rgba(0,0,0,.35)}
.photo-panel .abs.t-h2{--fs:7.2cqw;font-weight:800}
.photo-panel .abs.t-h3{--fs:5cqw;font-weight:700}
.photo-panel .abs.t-p{--fs:3.9cqw;line-height:1.4}
.photo-panel .abs.t-kicker,.photo-panel .abs.t-micro{--fs:2.6cqw;letter-spacing:.14em}

.photo-panel .abs{box-sizing:border-box}
.photo-panel .abs.t-photo .photo{flex:none;max-height:none;min-height:0;margin:0;border-radius:0;height:100%}
.photo-panel .abs.t-photo .photo.has-ar{height:auto}
.photo-panel .group>*{margin:0}
.lnk{display:block;color:inherit;text-decoration:none}

@media(min-width:851px){.spread.ratio{align-items:start}.spread.ratio .panel{aspect-ratio:var(--ratio);height:auto;min-height:0}}
</style>

  结构：meta（页头信息） + faces（面，每面若干张卡片；每面卡片数必须相同）
  卡片 card：{ "theme":"default|cover|sage", "pageNo":"01"(可省), "blocks":[ ...积木... ] }
  meta 里可加 "cardRatio":0.6（卡片宽高比，电脑端按这个比例显示；做竖版手机卡片时建议加）
  theme 还有 "photo"：整张图当背景 {"bg":{"src","alt","overlay":0~0.8,"focus":"50% 60%"}}；积木加 "pos":{x,y,w(占卡片宽高的%),size,align,color,font} 就按坐标摆放
  积木 block 类型（按顺序排列，想要几个都行）：
    kicker 小标题 | h2 大标题 | h3 中标题 | p 正文 | micro 极小字 | tag 封面品牌字
    line 分隔线 | note 带竖线的说明 | button {text,href} 按钮
    photo  {src:"图片地址或相对路径", alt:"说明"}  ← 放真实图片；也可 art:"flowers"/"room" 用内置插画
    products {items:[{title,desc,src(可省)}]} 产品列表
    contacts {items:[{label,text,href}]} 联系方式；href 支持 https:// mailto: tel:
    socials  {items:[{text,href}]} 社媒按钮
    group {push:true/false, blocks:[...]}  把几块包成一组；push:true 表示整组贴到卡片底部
  文字里换行写 \n 。所有文字都会自动转义，不会出现 HTML 注入。
-->

<script>

const $=id=>document.getElementById(id);
function fail(msg){document.body.innerHTML='<div class="data-error">'+String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>';throw new Error(msg)}
let DATA;
try{DATA=JSON.parse($('brochure-data').textContent)}catch(e){fail('卡片数据 JSON 格式有误，请检查逗号、引号、括号是否成对：\n'+e.message)}
if(!DATA||!Array.isArray(DATA.faces)||!DATA.faces.length)fail('JSON 里缺少 faces（至少要有一个面）。');
const faces=DATA.faces, PER=faces[0].cards?.length||0, meta=DATA.meta||{};
if(!PER)fail('第 1 个面里没有 cards。');
faces.forEach((f,i)=>{if(!Array.isArray(f.cards)||f.cards.length!==PER)fail('每个面的卡片数必须相同：第 1 个面有 '+PER+' 张，第 '+(i+1)+' 个面有 '+(f.cards?.length||0)+' 张。')});
const TOTAL=faces.length*PER, allCards=faces.flatMap(f=>f.cards);
const pad=n=>String(n).padStart(2,'0');
const faceOf=i=>Math.floor(i/PER);

/* ---------- safe HTML builders ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>esc(s).replace(/\n/g,'<br>');
const href=h=>/^(https?:|mailto:|tel:|#)/i.test(h||'')?esc(h):'#';
const ext=h=>/^https?:/i.test(h||'')?' target="_blank" rel="noreferrer"':'';
const ART={
 flowers:'<div class="photo flowerphoto" role="img" aria-label="ALT"><span class="branch"></span><span class="petal w f1"></span><span class="petal p f2"></span><span class="petal w f3"></span><span class="petal f4"></span><span class="petal w f5"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span></div>',
 room:'<div class="photo room" role="img" aria-label="ALT"><span class="wallframe"></span><span class="console"></span><span class="leg l"></span><span class="leg r"></span><span class="plant"></span><span class="leaf a"></span><span class="leaf b"></span><span class="leaf c"></span><span class="leaf d"></span><span class="vase"></span></div>'
};
const BLOCKS={
 kicker:b=>`<div class="kicker">${txt(b.text)}</div>`,
 h2:b=>`<h2>${txt(b.text)}</h2>`,
 h3:b=>`<h3>${txt(b.text)}</h3>`,
 p:b=>`<p>${txt(b.text)}</p>`,
 micro:b=>`<div class="micro">${txt(b.text)}</div>`,
 tag:b=>`<span class="year">${txt(b.text)}</span>`,
 line:()=>'<div class="thin-line"></div>',
 note:b=>`<div class="cover-bottom"><span class="accentbar"></span><span>${txt(b.text)}</span></div>`,
 button:b=>`<a class="action" href="${href(b.href)}"${ext(b.href)}>${txt(b.text)}</a>`,
 photo:b=>{const ar=b.ar!=null?` style="aspect-ratio:${num(b.ar,1,0.2,5)};"`:'',cls=b.ar!=null?'photo has-ar':'photo';
   return b.src?`<div class="${cls}"${ar}><img src="${esc(b.src)}" alt="${esc(b.alt||'')}" loading="lazy" decoding="async" draggable="false"></div>`
                :(ART[b.art]||'').replace('ALT',esc(b.alt||'')).replace('class="photo ',`class="${cls} `)},
 link:b=>`<a class="lnk" href="${href(b.href)}"${ext(b.href)}>${txt(b.text)}</a>`,
 products:b=>'<div class="product-grid">'+(b.items||[]).map(it=>`<div class="product-item"><div class="product-thumb">${it.src?`<img src="${esc(it.src)}" alt="" loading="lazy" decoding="async" draggable="false">`:''}</div><div><strong>${txt(it.title)}</strong><small>${txt(it.desc)}</small></div></div>`).join('')+'</div>',
 contacts:b=>'<div class="contact-list">'+(b.items||[]).map(it=>`<a href="${href(it.href)}"${ext(it.href)}><span class="label">${txt(it.label)}</span>${txt(it.text)}</a>`).join('')+'</div>',
 socials:b=>'<div class="socials">'+(b.items||[]).map(it=>`<a href="${href(it.href)}"${ext(it.href)}>${txt(it.text)}</a>`).join('')+'</div>',
 group:b=>`<div class="group${b.push?' push':''}">${(b.blocks||[]).map(blockHTML).join('')}</div>`
};
const HEX=/^#[0-9a-f]{3,8}$/i, HEXRGBA=/^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i;
function TY(o){
  let s='';
  if(o.size!=null)s+=`font-size:${num(o.size,4,0.5,30)}cqw;`;
  if(HEX.test(o.color||''))s+=`color:${o.color};text-shadow:none;`;
  if(o.font==='serif')s+='font-family:Georgia,"Times New Roman",serif;';
  if(o.font==='sans')s+='font-family:Inter,"Helvetica Neue",Arial,sans-serif;';
  if(o.weight!=null)s+=`font-weight:${Math.round(num(o.weight,400,100,900))};`;
  if(/^(left|center|right)$/.test(o.align||''))s+=`text-align:${o.align};`;
  if(o.lh!=null)s+=`line-height:${num(o.lh,1.3,0.8,3)};`;
  if(o.ls!=null)s+=`letter-spacing:${num(o.ls,0,-0.1,1)}em;`;
  if(o.mt!=null)s+=`margin-top:${num(o.mt,0,0,50)}cqw;`;
  if(o.mb!=null)s+=`margin-bottom:${num(o.mb,0,0,50)}cqw;`;
  return s;
}
function blockHTML(b){
  const f=BLOCKS[b&&b.type];if(!f){console.warn('未知积木类型：',b);return ''}
  let html=f(b), st=b.style||{}, css;
  if(b.type==='line'){css='margin:0;'+(HEX.test(st.color||'')?`background:${st.color};`:'')+(st.size!=null?`height:${num(st.size,0.3,0.05,5)}cqw;`:'')}
  else css=TY(st);
  return css?html.replace(/^<([a-zA-Z0-9]+)/,(m,t)=>`<${t} style="${css}"`):html;
}
const num=(v,d,lo=0,hi=100)=>{v=Number(v);return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
const TYKEYS=['size','color','font','weight','align','lh','ls','mt','mb'];
function absBlock(b){
  const p=b.pos||{};
  let s=`left:${num(p.x,0)}%;top:${num(p.y,0)}%;width:${num(p.w,80)}%;`;
  if(p.h!=null)s+=`height:${num(p.h,10)}%;`;
  if(HEXRGBA.test(p.bg||''))s+=`background:${p.bg};`;
  if(p.pad!=null){const a=[].concat(p.pad).map(v=>num(v,0,0,30));s+=`padding:${a[0]}cqw ${a.length>1?a[1]:a[0]}cqw;`}
  const merged={...(b.style||{})};TYKEYS.forEach(k=>{if(p[k]!=null)merged[k]=p[k]});
  const b2={...b,style:merged};if(p.ar!=null)b2.ar=p.ar;
  return `<div class="abs t-${esc(b.type)}" style="${s}">${blockHTML(b2)}</div>`;
}
function cardToHTML(c){
  const pn=c.pageNo?`<span class="page-no">${esc(c.pageNo)}</span>`:'';
  const blocks=c.blocks||[];
  if(c.theme!=='photo')return pn+blocks.map(blockHTML).join('');
  const bg=c.bg||{};
  const ov=num(bg.overlay,bg.src?0.2:0,0,0.9);
  const oc=HEX.test(bg.overlayColor||'')?bg.overlayColor:'#000';
  const bgc=HEX.test(bg.color||'')?`background:${bg.color};`:'';
  const foc=/^\d{1,3}%( \d{1,3}%)?$/.test(bg.focus||'')?bg.focus:'50% 50%';
  const img=bg.src?`<img src="${esc(bg.src)}" alt="${esc(bg.alt||'')}" decoding="async" draggable="false" style="object-position:${foc}">`:'';
  const abs=blocks.filter(b=>b&&b.pos), flow=blocks.filter(b=>b&&!b.pos);
  return `<div class="bg" style="--ov:${ov};--oc:${oc};${bgc}">${img}</div>`+pn+abs.map(absBlock).join('')+(flow.length?`<div class="flow">${flow.map(blockHTML).join('')}</div>`:'');
}
const cardHTML=allCards.map(cardToHTML);
const pageClass=g=>{const t=allCards[g]?.theme;return t==='cover'?'panel cover':t==='sage'?'panel sage-panel':t==='photo'?'panel photo-panel':'panel'};

/* ---------- static chrome ---------- */
document.title=meta.pageTitle||document.title;
$('brandLogo').textContent=meta.logo||'';$('brandName').textContent=meta.brandName||'';$('brandSub').textContent=meta.brandSub||'';
$('brandLink').href=href(meta.brandUrl);$('headline').textContent=meta.headline||'';$('subline').textContent=meta.subline||'';
$('topLinks').innerHTML=(meta.topLinks||[]).map(l=>`<a href="${href(l.href)}"${ext(l.href)}>${txt(l.text)}</a>`).join('');
$('faceTabs').innerHTML=faces.map((f,i)=>`<button class="${i?'':'active'}">${txt(f.tab||'SIDE '+(i+1))}</button>`).join('');
if(faces.length<2)$('faceTabs').style.display='none';
$('dots').innerHTML=Array.from({length:PER},(_,i)=>`<button class="dot${i?'':' active'}" aria-label="Panel ${i+1}"></button>`).join('');
const spread=$('spread');
spread.style.setProperty('--cols',PER);
if(meta.cardRatio!=null){spread.style.setProperty('--ratio',num(meta.cardRatio,0.6,0.3,1.5));spread.classList.add('ratio')}
spread.innerHTML=Array.from({length:PER},(_,i)=>`<article class="panel" data-index="${i}"></article>`).join('');

const panels=[...document.querySelectorAll('.panel')];
const tabs=[...document.querySelectorAll('.face-tabs button')];
const dots=[...document.querySelectorAll('.dot')];
const prev=$('prev'), next=$('next');
let index=0;
const isMobile=()=>window.matchMedia('(max-width:850px)').matches;
let lastRenderedIndex=-1;

function buildPreview(g){
  spread.querySelector('.next-preview')?.remove();
  if(g<0||g>=TOTAL)return null;
  const preview=panels[g%PER].cloneNode(false);
  preview.className=pageClass(g)+' next-preview';
  preview.innerHTML=cardHTML[g];
  preview.dataset.previewIndex=String(g);
  preview.setAttribute('aria-hidden','true');
  preview.querySelectorAll('a,button').forEach(el=>{el.setAttribute('tabindex','-1');el.setAttribute('aria-hidden','true')});
  spread.appendChild(preview);
  return preview;
}
function syncChrome(){
  const f=faceOf(index), local=index%PER;
  tabs.forEach((t,i)=>t.classList.toggle('active',i===f));
  dots.forEach((d,i)=>d.classList.toggle('active',i===local));
  $('sideLabel').textContent=(faces[f].tab||'')+' · '+PER+'-PANEL SPREAD';
  $('viewNote').textContent=faces[f].note||'';
}
function paintMobilePage(){
  const f=faceOf(index), local=index%PER;
  spread.querySelector('.next-preview')?.remove();
  panels.forEach((p,i)=>{
    p.className=pageClass(f*PER+i);
    p.dataset.index=String(i);
    p.innerHTML=cardHTML[f*PER+i];
    p.classList.toggle('current',i===local);
    p.removeAttribute('style');
  });
  if(index<TOTAL-1)buildPreview(index+1);
  lastRenderedIndex=index;
  syncChrome();
  $('counter').textContent=pad(index+1)+' / '+pad(TOTAL);
  prev.disabled=index===0; next.disabled=index===TOTAL-1;
}
function render(){
  if(isMobile()){paintMobilePage();return}
  const f=faceOf(index), local=index%PER;
  spread.querySelector('.next-preview')?.remove();
  panels.forEach((p,i)=>{
    p.className=pageClass(f*PER+i)+' current';
    p.dataset.index=String(i);
    p.innerHTML=cardHTML[f*PER+i];
    p.removeAttribute('style');
  });
  syncChrome();
  $('counter').textContent=pad(local+1)+' / '+pad(PER);
  prev.disabled=local===0; next.disabled=local===PER-1;
}
function setSide(fi){index=fi*PER;render()}
function move(step){
  if(isMobile()){index=Math.max(0,Math.min(TOTAL-1,index+step))}
  else{const f=faceOf(index);index=f*PER+Math.max(0,Math.min(PER-1,index%PER+step))}
  render();
}
let turnAnimationBusy=false;
function animateTurn(step){
  if(!isMobile()){move(step);return}
  if(turnAnimationBusy || dragActive) return;
  const target=Math.max(0,Math.min(TOTAL-1,index+step));
  if(target===index)return;
  const card=spread.querySelector('.panel.current');
  if(!card){move(step);return}
  turnAnimationBusy=true;
  const preview=buildPreview(target);
  if(preview){
    preview.style.transition='none';
    preview.style.transform='translate3d(0,5px,0) scale(.965)';
  }
  card.style.transition='transform .24s cubic-bezier(.2,.72,.2,1)';
  card.style.pointerEvents='none';
  requestAnimationFrame(()=>{
    if(preview){
      preview.style.transition='transform .24s cubic-bezier(.2,.72,.2,1)';
      preview.style.transform='translate3d(0,0,0) scale(1)';
    }
    card.style.transform=`translate3d(${step>0?-105:105}%,0,0) rotate(${step>0?-4:4}deg)`;
  });
  window.setTimeout(()=>{
    card.style.transform='';
    card.style.transition='';
    card.style.pointerEvents='';
    turnAnimationBusy=false;
    move(step);
  },245);
}
prev.addEventListener('click',()=>animateTurn(-1));
next.addEventListener('click',()=>animateTurn(1));
dots.forEach((d,i)=>d.addEventListener('click',()=>{index=faceOf(index)*PER+i;render()}));
tabs.forEach((t,i)=>t.addEventListener('click',()=>setSide(i)));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')animateTurn(-1);if(e.key==='ArrowRight')animateTurn(1)});

// Book-like card drag: direct touch tracking, with threshold-based page turning.
let dragStartX=0, dragStartY=0, dragX=0, dragActive=false, activeCard=null, pointerId=null;
const turnThreshold=()=>Math.min(125,Math.max(70,window.innerWidth*.20));
function dragBegin(x,y,id,card){
  if(!isMobile() || dragActive || turnAnimationBusy) return;
  dragActive=true; dragStartX=x; dragStartY=y; dragX=0; activeCard=card; pointerId=id;
  card.classList.add('dragging');
  card.style.transition='none';
  card.style.willChange='transform';
}
function dragMove(x,y,evt){
  if(!dragActive || !activeCard) return;
  const dx=x-dragStartX, dy=y-dragStartY;
  if(Math.abs(dy)>Math.abs(dx)*1.35 && Math.abs(dx)<18) return;
  if(evt && evt.cancelable) evt.preventDefault();
  dragX=dx;
  const atStart=index===0 && dx>0;
  const atEnd=index===TOTAL-1 && dx<0;
  const resisted=(atStart||atEnd)?dx*.32:dx;
  activeCard.style.transform=`translate3d(${resisted}px,0,0) rotate(${resisted/55}deg)`;
  // Left drag peels the current page away to reveal the next page.
  // Right drag reverses that motion and reveals the previous page underneath.
  const targetIndex=dx>0?index-1:index+1;
  let preview=spread.querySelector('.next-preview');
  if(targetIndex>=0 && targetIndex<=5){
    if(!preview || Number(preview.dataset.previewIndex)!==targetIndex){
      preview=buildPreview(targetIndex);
    }
  } else if(preview) {
    preview.remove();
    preview=null;
  }
  if(preview){
    const progress=Math.min(1,Math.abs(dx)/turnThreshold());
    const scale=.965+(.035*progress);
    const y=5*(1-progress);
    preview.style.transition='none';
    preview.style.transform=`translate3d(0,${y}px,0) scale(${scale})`;
  }
}
function dragFinish(){
  if(!dragActive || !activeCard) return;
  const card=activeCard, dx=dragX;
  card.classList.remove('dragging');
  card.style.transition='transform .19s cubic-bezier(.2,.75,.25,1)';
  const threshold=turnThreshold();
  const direction=(dx < -threshold && index<TOTAL-1)?1:((dx > threshold && index>0)?-1:0);
  if(direction){
    const distance=direction===1?-window.innerWidth:window.innerWidth;
    card.style.pointerEvents='none';
    card.style.transform=`translate3d(${distance}px,0,0) rotate(${direction===1?-5:5}deg)`;
    const preview=spread.querySelector('.next-preview');
    if(preview){
      preview.style.transition='transform .19s cubic-bezier(.2,.75,.25,1)';
      preview.style.transform='translate3d(0,0,0) scale(1)';
    }
    window.setTimeout(()=>{
      card.style.transform='';card.style.opacity='';card.style.transition='';card.style.willChange='';card.style.pointerEvents='';
      dragActive=false;activeCard=null;pointerId=null;move(direction);
    },190);
  }else{
    card.style.transform='translate3d(0,0,0) rotate(0deg)';
    const preview=spread.querySelector('.next-preview');
    if(preview){preview.style.transition='transform .24s ease';preview.style.transform='translate3d(0,5px,0) scale(.965)';}
    window.setTimeout(()=>{
      card.style.transform='';card.style.opacity='';card.style.willChange='';
      dragActive=false;activeCard=null;pointerId=null;
      render(); // Restore the normal next-page stack after an incomplete drag.
    },250);
  }
}
spread.addEventListener('touchstart',e=>{
  if(!isMobile() || dragActive || e.target.closest('a,button')) return;
  const card=e.target.closest('.panel.current');
  if(!card) return;
  const t=e.changedTouches[0];
  dragBegin(t.clientX,t.clientY,null,card);
},{passive:true});
spread.addEventListener('touchmove',e=>{
  if(!dragActive || !activeCard) return;
  const t=e.changedTouches[0];
  dragMove(t.clientX,t.clientY,e);
},{passive:false});
spread.addEventListener('touchend',()=>{if(dragActive)dragFinish()},{passive:true});
spread.addEventListener('touchcancel',()=>{if(dragActive)dragFinish()},{passive:true});

// Mouse/pen drag support for responsive desktop previews.
spread.addEventListener('pointerdown',e=>{
  if(!isMobile() || e.pointerType==='touch' || e.target.closest('a,button'))return;
  const card=e.target.closest('.panel.current');if(!card)return;
  dragBegin(e.clientX,e.clientY,e.pointerId,card);
});
spread.addEventListener('pointermove',e=>{if(dragActive&&e.pointerType!=='touch'&&e.pointerId===pointerId)dragMove(e.clientX,e.clientY,e)});
spread.addEventListener('pointerup',e=>{if(dragActive&&e.pointerType!=='touch'&&e.pointerId===pointerId)dragFinish()});
spread.addEventListener('pointercancel',()=>{if(dragActive)dragFinish()});

let lastMobile=isMobile();
window.addEventListener('resize',()=>{
  if(dragActive||turnAnimationBusy)return;           // 手机地址栏伸缩会触发 resize，拖动中不能重绘
  const m=isMobile(); if(m!==lastMobile){lastMobile=m;render()}
});
render();

</script>
</body>
